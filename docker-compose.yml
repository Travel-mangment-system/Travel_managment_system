services:

  mysql:
    image: mysql:8.4
    container_name: travel-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: manager
      MYSQL_DATABASE: travel_db

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    image: travel-backend:latest
    container_name: travel-backend

    depends_on:
      - mysql

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/travel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: manager

  frontend:
    image: travel-frontend:latest
    container_name: travel-frontend

    depends_on:
      - backend

    ports:
      - "3000:80"

volumes:
  mysql-data: