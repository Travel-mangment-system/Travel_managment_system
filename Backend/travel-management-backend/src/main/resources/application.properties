# ===================================================================
# SPRING APPLICATION CONFIGURATION
# ===================================================================
spring.application.name=travel-management-system

# Server Port (Default is 8080, change if your frontend needs it)
server.port=8080

# ===================================================================
# DATABASE CONNECTION CONFIGURATION (MySQL)
# ===================================================================
# Automatically creates the database 'travel_db' if it does not exist on your machine
spring.datasource.url=jdbc:mysql://localhost:3306/travel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=rbkj6789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / HIBERNATE PROPERTIES
# ===================================================================
# 'update' automatically alters your MySQL tables whenever your team edits a Java Entity class
spring.jpa.hibernate.ddl-auto=update

# Shows the raw SQL queries executed by your backend in the STS console window
spring.jpa.show-sql=true

# Formats the SQL in the console beautifully so it's readable and easy to debug
spring.jpa.properties.hibernate.format_sql=true

# Forces Hibernate to use MySQL 8 features explicitly
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# JACKSON CONFIGURATION (Date & Time formatters for Frontend)
# ===================================================================
# Ensures your timestamps and LocalTime objects don't get converted into ugly arrays in JSON
#spring.jackson.serialization.write-dates-as-timestamps=false
